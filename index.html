        content="PAR-TEE | Golf Games for Every Round">

<body>

    <main class="homePage">
        <div class="homeVisual">

            <div id="appHeader"></div>

            
            <section class="welcomeSection" aria-labelledby="welcomeTitle">
                <p class="welcomeEyebrow">WELKOM</p>

                <h1 id="welcomeTitle">  
                    Maak je<br>ronde leuker
                </h1>

                <p class="welcomeDescription">
                    Minigames voor iedere golfronde.
                </p>
            </section>


            <section class="gamesSection" id="games"
                aria-labelledby="gamesTitle">

                <h2 class="visuallyHidden" id="gamesTitle">
                    Onze spellen
                </h2>

                <a
                    class="featuredGameCard"
                    href="games/sink-or-win/sink-or-win.html"
                >
                    <div class="featuredGameContent">
                        <span class="gameStatus gameStatusAvailable">
                            NIEUW
                        </span>

                        <h3>Sink or Win</h3>
                        <p>Daag elkaar uit in dit spannende minigame!</p>

                        <span class="gameAction">
                            <span>Start spel</span>
                            <span class="arrow" aria-hidden="true">›</span>
                        </span>
                    </div>
                </a>

                <div class="comingSoonGames">
                    <article class="comingSoonCard">
                        <h3>Multiplayer</h3>
                        <span class="comingSoonLabel">COMING SOON</span>
                    </article>

                    <a href="instellingen/spelregels/spelregels.html" class="comingSoonCard">
                        <h3>Spelregels</h3>
                        <span class="cardSubtitle">Bekijk de spelregels</span>
                    </a>
                </div>

            </section>
        </div>
