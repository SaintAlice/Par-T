
<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#194D3A">

    <title data-i18n="settings.aboutPage.title">Over PAR-TEE</title>

    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/navigation.css">
    <link rel="stylesheet" href="css/over-par-t.css">
</head>
<body>

    <main class="aboutPage">

        <section class="aboutContent">
            <img
                class="aboutLogo"
                src="../images/par-t-logo4.png"
                alt="PAR-TEE logo"
            >

            <p class="aboutTagline">GOLF GAMES FOR EVERY ROUND</p>

            <h1 data-i18n="settings.aboutPage.title">Over PAR-TEE</h1>

            <p class="aboutLead">
                Turn your round into a game.
            </p>

            <p class="aboutDescription" data-i18n="settings.aboutPage.description">
                PAR-TEE maakt golf leuker met interactieve minigames
                en nieuwe uitdagingen tijdens je ronde. Daag elkaar uit,
                voeg een spelelement toe en maak van iedere ronde
                iets bijzonders.
            </p>

            <p class="aboutVersion" id="appVersion"></p>
        </section>
    </main>

    <script src="https://unpkg.com/lucide@latest"></script>
    <script type="module" src="../navigation.js"></script>
    <script type="module" src="instellingen.js"></script>
    <script src="../header.js" data-root="../"></script>

    <script>
        window.va = window.va || function () {
            (window.vaq = window.vaq || []).push(arguments);
        };
    </script>

    <script type="module">
        import { initLanguage } from "../../js/shared/i18n/i18n.js";

        initLanguage();
    </script>

<script src="../js/shared/config/config.js"></script>
<script>
    document.querySelector("#appVersion").textContent =
        `PAR-TEE · St.Alice · Versie ${window.PAR_TEE_CONFIG.APP_VERSION}`;
</script>

</body>
</html>
