
<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#F5F3EA">

    <title>Instellingen | PAR-TEE </title>

    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/home.css">
    <link rel="stylesheet" href="../css/navigation.css">
    <link rel="stylesheet" href="css/instellingen.css">
    <link rel="stylesheet" href="../css/header.css">
</head>
<body>

    <main class="settingsPage">
        <div id="appHeader"></div>

        <div class="settingsVisual">
            <section class="settingsSection" aria-labelledby="generalSettingsTitle">
                <h2 id="generalSettingsTitle">Algemeen</h2>

                <div class="settingsCard">
                    <div class="settingsRow">
                        <i class="settingsRowIcon" data-lucide="languages"></i>

                        <div class="settingsRowContent">
                            <label for="languageSelect">Taal</label>
                            <p>Kies de taal van de app.</p>
                        </div>

                        <select id="languageSelect" name="language">
                            <option value="nl">Nederlands</option>
                        </select>
                    </div>

                    <a class="settingsRow" href="over-par-t.html">
                        <i class="settingsRowIcon" data-lucide="info"></i>

                        <span class="settingsRowContent">
                            <span class="settingsRowTitle">Over PAR-TEE</span>
                            <span class="settingsRowDescription">
                                Meer informatie over de app.
                            </span>
                        </span>

                        <span class="settingsArrow" aria-hidden="true">›</span>
                    </a>

                    <a class="settingsRow" href="spelregels/spelregels.html">
                        <i class="settingsRowIcon" data-lucide="book-open"></i>

                        <span class="settingsRowContent">
                            <span class="settingsRowTitle">Spelregels</span>
                            <span class="settingsRowDescription">
                                Lees de spelregels van de PAR-TEE-spellen.
                            </span>
                        </span>

                        <span class="settingsArrow" aria-hidden="true">›</span>
                    </a>
                </div>
            </section>
        </div>
    </main>

    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="../navigation.js"></script>
    <script src="instellingen.js"></script>
    <script src="../header.js" data-root="../"></script>
   
    <script>
        window.va = window.va || function () {
            (window.vaq = window.vaq || []).push(arguments);
        };
    </script>
    <script defer src="/_vercel/insights/script.js"></script>
    
</body>
</html>
