
<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#F5F3EA">

    <title data-i18n="settings.title">Instellingen | PAR-TEE</title>

    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/home.css">
    <link rel="stylesheet" href="../css/navigation.css">
    <link rel="stylesheet" href="../css/header.css">
    <link rel="stylesheet" href="css/instellingen.css">

</head>
<body>

    <main class="settingsPage">
        <main class="contactPage">
        <div id="appHeader"></div>

        <section class="contactContent">
        <div id="appHeader"></div>

        <div class="settingsVisual">
            <section class="settingsSection" aria-labelledby="generalSettingsTitle">
                <h2 id="generalSettingsTitle" data-i18n="settings.general">Algemeen</h2>

                <div class="settingsCard">
                    <div class="settingsRow">
                        <i class="settingsRowIcon" data-lucide="languages"></i>

                        <div class="settingsRowContent">
                            <label for="languageSelect" data-i18n="settings.language">Taal</label>
                            <p data-i18n="settings.languageDescription">Kies de taal van de app.</p>
                        </div>

                        <select id="languageSelect" name="language">
                            <option value="nl" data-i18n="settings.dutch">Nederlands</option>
                            <option value="en" data-i18n="settings.english">Engels</option>
                        </select>
                    </div>

                    <a class="settingsRow" href="over-par-t.html">
                        <i class="settingsRowIcon" data-lucide="info"></i>

                        <span class="settingsRowContent">
                            <span class="settingsRowTitle" data-i18n="settings.about">Over PAR-TEE</span>
                            <span class="settingsRowDescription" data-i18n="settings.aboutDescription">
                                Meer informatie over de app.
                            </span>
                        </span>

                        <span class="settingsArrow" aria-hidden="true">›</span>
                    </a>

                    <a class="settingsRow" href="spelregels/spelregels.html">
                        <i class="settingsRowIcon" data-lucide="book-open"></i>

                        <span class="settingsRowContent">
                            <span class="settingsRowTitle" data-i18n="settings.gameRules">Spelregels</span>
                            <span class="settingsRowDescription" data-i18n="settings.gameRulesDescription">
                                Lees de spelregels van de PAR-TEE-spellen.
                            </span>
                        </span>

                        <span class="settingsArrow" aria-hidden="true">›</span>
                    </a>

                    <a class="settingsRow" href="contact.html">
                        <i class="settingsRowIcon" data-lucide="mail"></i>

                        <span class="settingsRowContent">
                            <span class="settingsRowTitle" data-i18n="settings.contact">
                                Contact
                            </span>
                            <span class="settingsRowDescription" data-i18n="settings.contactDescription">
                                Heb je een vraag, suggestie of probleem? Neem contact met ons op.
                            </span>
                        </span>

                        <span class="settingsArrow" aria-hidden="true">›</span>
                    </a>

                </div>
            </section>
        </div>
    </main>

    <script src="https://unpkg.com/lucide@latest"></script>
    <script type="module" src="../navigation.js"></script>
    <script type="module" src="instellingen.js"></script>
    <script src="../header.js" data-root="../"></script>
   
    <script>
        window.va = window.va || function () {
            (window.vaq = window.vaq || []).push(arguments);
        };
    </script>
    <script defer src="/_vercel/insights/script.js"></script>
    
</body>
</html>
