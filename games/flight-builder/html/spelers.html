<!DOCTYPE html>
<html lang="nl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#194D3A">

    <title data-i18n="games.flightBuilder.playersPage.pageTitle">Spelers - Flight Builder | PAR-TEE</title>

    <link rel="stylesheet" href="../../spin-the-tee/css/style.css">
    <link rel="stylesheet" href="../../spin-the-tee/css/spelers.css">
    <link rel="stylesheet" href="../../../css/navigation.css">
    <link rel="stylesheet" href="../css/spelers.css">
</head>

<body>

<main class="page playersPage">

    <header class="pageHeader">
        <h1 data-i18n="games.flightBuilder.playersPage.title">Spelers</h1>
        <p class="subtitle" data-i18n="games.flightBuilder.playersPage.subtitle">Wie doen er vandaag mee?</p>
    </header>

    <section class="pageContent">

        <div class="addPlayer">
            <input
                type="text"
                id="playerInput"
                data-i18n-placeholder="games.flightBuilder.playersPage.playerName"
                data-i18n-aria-label="games.flightBuilder.playersPage.playerName"
                placeholder="Naam speler"
                aria-label="Naam speler"
                maxlength="30"
                autocomplete="off">

            <button
                type="button"
                id="addPlayerButton"
                data-i18n-aria-label="games.flightBuilder.playersPage.addPlayer"
                aria-label="Speler toevoegen">
                +
            </button>
        </div>

        <section class="gameSettings">
            <div class="generalTeesCard">

                <button
                    type="button"
                    id="gameSettingsToggle"
                    class="generalTeesHeader"
                    aria-expanded="false">

                    <span class="settingsIcon" aria-hidden="true">⚙</span>

                    <span class="generalTeesHeading">
                        <strong data-i18n="games.flightBuilder.playersPage.settingsTitle">Flight-instellingen</strong>
                        <span id="selectedSettingsDescription">
                            Willekeurige verdeling · 4 spelers per flight
                        </span>
                    </span>

                    <span class="settingsArrow" aria-hidden="true"></span>
                </button>

                <div
                    id="gameSettingsContent"
                    class="generalTeesContent"
                    hidden>

                    <section class="settingsSection">
                        <h2 data-i18n="games.flightBuilder.playersPage.distributionTitle">Verdeelwijze</h2>
                        <p class="settingsDescription" data-i18n="games.flightBuilder.playersPage.distributionDescription">
                            Kies hoe de spelers over de flights worden verdeeld.
                        </p>

                        <div class="variantSlider">
                            <label class="variantOption">
                                <input
                                    type="radio"
                                    name="distributionMethod"
                                    value="random"
                                    checked>
                                <span data-i18n="games.flightBuilder.playersPage.methods.random">Willekeurig</span>
                            </label>

                            <label class="variantOption">
                                <input
                                    type="radio"
                                    name="distributionMethod"
                                    value="equalHandicap">
                                <span data-i18n="games.flightBuilder.playersPage.methods.equalHandicap">Gelijk gemiddeld handicap</span>
                            </label>

                            <label class="variantOption">
                                <input
                                    type="radio"
                                    name="distributionMethod"
                                    value="similarHandicap">
                                <span data-i18n="games.flightBuilder.playersPage.methods.similarHandicap">Handicap spreiden</span>
                            </label>
                        </div>
                    </section>

                    <section class="settingsSection">
                        <h2 data-i18n="games.flightBuilder.playersPage.flightSizeTitle">Flightgrootte</h2>
                        <p class="settingsDescription" data-i18n="games.flightBuilder.playersPage.flightSizeDescription">
                            Kies het gewenste maximale aantal spelers per flight.
                        </p>

                        <div class="variantSlider">
                            <label class="variantOption">
                                <input
                                    type="radio"
                                    name="playersPerFlight"
                                    value="2">
                                <span data-i18n="games.flightBuilder.playersPage.playerOption2">2 spelers</span>
                            </label>

                            <label class="variantOption">
                                <input
                                    type="radio"
                                    name="playersPerFlight"
                                    value="3">
                                <span data-i18n="games.flightBuilder.playersPage.playerOption3">3 spelers</span>
                            </label>

                            <label class="variantOption">
                                <input
                                    type="radio"
                                    name="playersPerFlight"
                                    value="4"
                                    checked>
                                <span data-i18n="games.flightBuilder.playersPage.playerOption4">4 spelers</span>
                            </label>
                        </div>
                    </section>

                </div>
            </div>
        </section>

        <div id="playerList"></div>

        <p
            id="gameValidationMessage"
            class="validationMessage"
            role="status"
            hidden>
        </p>

    </section>

    <footer class="pageFooter">
        <button
            type="button"
            id="nextButton"
            class="primaryButton"
            disabled
            data-i18n="games.flightBuilder.playersPage.nextButton">
            Flights samenstellen →
        </button>
    </footer>

</main>

<script src="https://unpkg.com/lucide@latest"></script>
<script type="module" src="../js/spelers.js"></script>
<script type="module" src="../../../navigation.js"></script>
<script type="module" src="../../../home.js"></script>
<<script src="../../../js/icons.js"></script>

<script>
    window.va = window.va || function () {
        (window.vaq = window.vaq || []).push(arguments);
    };
</script>
<script defer src="/_vercel/insights/script.js"></script>

</body>
</html>
