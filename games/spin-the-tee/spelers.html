
<!DOCTYPE html>
<html lang="nl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Spelers - Spin to Tee</title>

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/spelers.css">
    <link rel="stylesheet" href="css/navigation.css">

</head>

<body>

<main class="page playersPage">

    <header class="pageHeader">
        <h1 data-i18n="games.spinTheTee.players.title">Spelers</h1>
        <p class="subtitle" data-i18n="games.spinTheTee.players.subtitle">Wie doen er vandaag mee?</p>
    </header>

    <section class="pageContent">

        <div class="addPlayer">
            <input
                type="text"
                id="playerInput"
                placeholder="Naam speler"
                aria-label="Naam speler"
                data-i18n-placeholder="games.spinTheTee.players.addPlayer">

            <button id="addPlayerButton" aria-label="Speler toevoegen">
                +
            </button>
        </div>

        <section class="gameSettings">

            <div class="generalTeesCard">

                <button
                    type="button"
                    id="generalTeesToggle"
                    class="generalTeesHeader"
                    aria-expanded="false">

                    <span class="settingsIcon" aria-hidden="true">⚙</span>

                    <span class="generalTeesHeading">
                        <strong data-i18n="games.spinTheTee.players.gameSettings">Spelinstellingen</strong>
                        <span data-i18n="games.spinTheTee.players.generalTeesDescription">Tee-selectie en verdeling</span>
                    </span>
                    <span class="settingsArrow" aria-hidden="true"></span>
                </button>

                <div id="generalTeesContent" class="generalTeesContent" hidden>

                    <section class="settingsSection">
                        <h2 data-i18n="games.spinTheTee.players.teeSelectionTitle">Welke tee's doen mee?</h2>

                        <div id="generalTeeOptions" class="generalTeeOptions">

                            <label class="generalTeeOption">
                                <input type="checkbox" value="Wit" data-tee="wit">
                                <span class="teeDot teeDot-wit" aria-hidden="true"></span>
                                <span data-i18n="games.spinTheTee.players.teeSelection.white">Wit</span>
                            </label>

                            <label class="generalTeeOption">
                                <input type="checkbox" value="Geel" data-tee="geel">
                                <span class="teeDot teeDot-geel" aria-hidden="true"></span>
                                <span data-i18n="games.spinTheTee.players.teeSelection.yellow">Geel</span>
                            </label>

                            <label class="generalTeeOption">
                                <input type="checkbox" value="Blauw" data-tee="blauw">
                                <span class="teeDot teeDot-blauw" aria-hidden="true"></span>
                                <span data-i18n="games.spinTheTee.players.teeSelection.blue">Blauw</span>
                            </label>

                            <label class="generalTeeOption">
                                <input type="checkbox" value="Rood" data-tee="rood">
                                <span class="teeDot teeDot-rood" aria-hidden="true"></span>
                                <span data-i18n="games.spinTheTee.players.teeSelection.red">Rood</span>
                            </label>

                            <label class="generalTeeOption">
                                <input type="checkbox" value="Oranje" data-tee="oranje">
                                <span class="teeDot teeDot-oranje" aria-hidden="true"></span>
                                <span data-i18n="games.spinTheTee.players.teeSelection.orange">Oranje</span>
                            </label>

                        </div>

                        <p class="settingsHint" data-i18n="games.spinTheTee.players.teeSelectionContext">
                            Deze selectie geldt voor alle spelers.
                        </p>
                    </section>

                    <div class="settingsDivider"></div>

                    <section class="settingsSection">
                        <h2 data-i18n="games.spinTheTee.players.teeDistributionTitle">Tee-verdeling</h2>
                        <p class="settingsDescription" data-i18n="games.spinTheTee.players.teeDistributionDescription">
                            Hoe verdelen we de tee's over de spelers?
                        </p>

                        <div class="teeDistributionOptions">

                            <label class="teeDistributionOption">
                                <input
                                    type="radio"
                                    name="teeDistribution"
                                    value="random"
                                    checked>

                                <span class="distributionIcon" aria-hidden="true">↝</span>

                                <span class="distributionText" data-i18n="games.spinTheTee.players.teeDistributionRandom">
                                    <strong>Willekeurig</strong>
                                    <small data-i18n="games.spinTheTee.players.teeDistributionRandomDescription">
                                        Verdeel de tee's willekeurig over de spelers. 
                                    </small>
                                </span>
                            </label>

                            <label class="teeDistributionOption">
                                <input
                                    type="radio"
                                    name="teeDistribution"
                                    value="balanced">

                                <span class="distributionIcon" aria-hidden="true">⇄</span>

                                <span class="distributionText" data-i18n="games.spinTheTee.players.teeDistributionEven">
                                    <strong>Gelijkmatig</strong>
                                    <small data-i18n="games.spinTheTee.players.teeDistributionEvenDescription">
                                        Verdeel de tee's zo gelijk mogelijk.
                                        Elke tee wordt minstens één keer gebruikt.
                                    </small>
                                </span>
                            </label>

                        </div>
                    </section>

                </div>

            </div>

        </section>

        <div id="playerList"></div>

        <p id="gameValidationMessage" class="validationMessage" hidden></p>

    </section>

    <footer class="pageFooter" data-i18n-aria-label="games.spinTheTee.players.footer" aria-label="Spelerslijst en startknop">
        <button id="nextButton" class="primaryButton" disabled aria-label="Start het spel" data-i18n="games.spinTheTee.players.startGame">
            Start draaien →
        </button>
    </footer>

</main>

<nav class="bottomNav" aria-label="Hoofdnavigatie">

    <a class="navItem" href="../../index.html">
        <span class="navIcon" aria-hidden="true">⌂</span>
        <span>Home</span>
    </a>

    <a class="navItem active"
       href="spin-the-tee.html"
       aria-current="page">
        <span class="navIcon" aria-hidden="true">♧</span>
        <span>Spellen</span>
    </a>

    <span class="navItem navDisabled" aria-disabled="true">
        <span class="navIcon" aria-hidden="true">⚙</span>
        <span>Instellingen</span>
    </span>

</nav>

<script src="https://unpkg.com/lucide@latest"></script>
<script type="module" src="js/spelers.js"></script>
<script type="module"  src="../../../navigation.js"></script>
<script type="module" src="../../../home.js"></script>
<script src="../../js/icons.js"></script>

<script>
    window.va = window.va || function () {
        (window.vaq = window.vaq || []).push(arguments);
    };
</script>
<script defer src="/_vercel/insights/script.js"></script>

</body>
</html>
