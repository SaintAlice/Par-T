<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#F6F5EF">

    <title>Spellen | PAR-T</title>

    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="games.css">
    <link rel="stylesheet" href="../css/navigation.css">
    <link rel="stylesheet" href="../css/header.css">
</head>
<body>

    <main class="gamesPage">

        <div id="appHeader"></div>

        <header class="gamesHeader">

            <h1>Spellen</h1>

            <p>Kies je spel en ga de baan op.</p>
        </header>

        <section class="gamesGrid" aria-label="Beschikbare spellen">

            <a class="gameCard spinCard"
               href="spin-the-tee/spin-the-tee.html">

                <div class="gameArtwork" aria-hidden="true">
                    <span class="spinWheel">↻</span>
                </div>

                <div class="gameInfo">
                    <span class="gameStatus">BESCHIKBAAR</span>
                    <h2>Spin the Tee</h2>
                    <p>Laat het lot bepalen vanaf welke tee je speelt.</p>
                </div>

                <span class="gameArrow" aria-hidden="true">›</span>
            </a>


            <article class="gameCard sinkWinCard">
                <div class="gameArtwork" aria-hidden="true">
                    <span class="sinkWinIcon">◎</span>
                </div>

                <div class="gameInfo">
                    <span class="gameStatus comingSoonStatus">COMING SOON</span>
                    <h2>Sink or Win</h2>
                    <p>Verdien punten, speel slimme zetten en probeer de pot te winnen.</p>
                </div>
            </article>

        </section>

    </main>

    <script src="../header.js" data-root="../"></script>
    <script src="../navigation.js"></script>

</body>
</html>
