
<!DOCTYPE html>
<html lang="nl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#194D3A">

    <title data-i18n = "games.sinkOrWin.score.pageTitle">Score - Sink or Win | PAR-TEE</title>

    <link rel="stylesheet" href="../spin-the-tee/css/style.css">
    <link rel="stylesheet" href="../spin-the-tee/css/spelers.css">
    <link rel="stylesheet" href="../../css/navigation.css">
    <link rel="stylesheet" href="css/spelers.css">
    <link rel="stylesheet" href="css/sink-or-win.css">
    <link rel="stylesheet" href="css/score.css">
</head>

<body>

<main class="page scorePage">

    <header class="pageHeader">
        <h1 id="holeTitle">Hole 1</h1>
        <p class="subtitle" id="holeDetails">Par 4 · SI 8</p>
    </header>

    <section class="pageContent">

        <div class="scoreActions">
            <button type="button" id="standingsButton" data-i18n="games.sinkOrWin.score.standingsButton">
                Tussenstand bekijken
            </button>
        </div>

        <section id="standingsSection" class="standingsSection" hidden>
            <h2 data-i18n="games.sinkOrWin.score.standingsTitle">Tussenstand</h2>
            <div id="standingsList"></div>
        </section>

        <section class="challengeSection">

            <button
                type="button"
                id="challengeToggleButton"
                class="challengeToggleButton"
                aria-expanded="false">

                <span data-i18n="games.sinkOrWin.score.challengesTitle">Uitdagingen</span>

            </button>

            <div id="challengeContent" hidden>

                <div id="challengeList">
                    <p class="emptyChallenges" data-i18n="games.sinkOrWin.score.noChallenges">
                        Er zijn nog geen uitdagingen voor deze hole.
                    </p>
                </div>

                <button type="button" id="challengeButton" data-i18n="games.sinkOrWin.score.challengeButton">
                    + Iemand uitdagen
                </button>

                <div id="challengeForm" class="challengeForm" hidden>

                    <div class="formGroup">
                        <label data-i18n="games.sinkOrWin.score.challengerLabel">Wie daagt uit?</label>
                        <div
                            id="challengerOptions"
                            class="playerOptions">
                        </div>
                    </div>

                    <div class="formGroup">
                        <label data-i18n="games.sinkOrWin.score.challengedLabel">Wie wordt uitgedaagd?</label>
                        <div
                            id="opponentOptions"
                            class="playerOptions">
                        </div>
                    </div>

                    <div id="challengeStakeGroup" class="formGroup" hidden>
                        <label data-i18n="games.sinkOrWin.score.pointsLabel">Aantal punten</label>

                        <div class="challengeStakeControls">
                            <button
                                type="button"
                                id="decreaseChallengeStake"
                                aria-label="Minder punten"
                                data-i18n-aria-label="games.sinkOrWin.score.ChallengeStakeDecrease">
                                −
                            </button>

                            <span id="challengeStakeValue">1</span>

                            <button
                                type="button"
                                id="increaseChallengeStake"
                                aria-label="Meer punten"
                                data-i18n-aria-label="games.sinkOrWin.score.challengeStakeIncrease">
                                +
                            </button>
                        </div>
                    </div>

                    <p
                        id="challengeValidationMessage"
                        role="status"
                        hidden>
                    </p>

                    <div
                        id="challengeFormActions"
                        class="challengeFormActions"
                        hidden>

                        <button
                            type="button"
                            id="saveChallengeButton"
                            data-i18n="games.sinkOrWin.score.confirmChallenge">
                            Uitdaging bevestigen
                        </button>

                        <button
                            type="button"
                            id="cancelChallengeButton"
                            data-i18n="common.cancel">
                            Annuleren
                        </button>

                    </div>

                </div>

            </div>

        </section>

        <section class="scoreSection">
            <h2 data-i18n="games.sinkOrWin.score.scoresTitle">Scores invoeren</h2>
            <div id="scoreList"></div>
        </section>

        <p
            id="scoreValidationMessage"
            class="validationMessage"
            role="status"
            hidden>
        </p>

        <section
            id="holeResultSection"
            class="holeResultSection"
            hidden>

            <h2 id="holeResultHeading" data-i18n="games.sinkOrWin.score.holeResultTitle">Resultaat hole</h2>

            <div id="holeResultList"></div>

            <section class="holePointsSection">
                <h3 data-i18n="games.sinkOrWin.score.pointsDistributionTitle">Puntenverdeling</h3>
                <div id="holePointsList"></div>
            </section>

            <section class="challengeResultSection">
                <h3 data-i18n="games.sinkOrWin.score.challengesTitle">Uitdagingen</h3>
                <div id="challengeResultList"></div>
            </section>

            <div id="birdieResultList"></div>

            <div class="holeResultActions">
                <button
                    type="button"
                    id="confirmHoleButton"
                    class="primaryButton"
                    data-i18n="games.sinkOrWin.score.finishHoleButton">
                    Hole afronden →
                </button>

                <button
                    type="button"
                    id="editScoresButton"
                    data-i18n="games.sinkOrWin.score.editScoresButton">
                    Scores aanpassen
                </button>
            </div>

            <button
                type="button"
                id="holeResultNewGameButton"
                class="newGameButton"
                data-i18n="common.newGameButton"
                hidden>
                Nieuw spel →
            </button>

        </section>

    </section>

    <!-- Definitieve resultatenpagina -->
    <section id="finalResultsSection" class="finalResultsSection" hidden>

        <!-- Eindstand -->
        <section class="finalStandingsSection">
            <h3 data-i18n="games.sinkOrWin.score.finalStandingsTitle">Definitieve eindstand</h3>
            <div id="finalStandingsList"></div>
        </section>

        <!-- Scorekaart -->
        <details class="finalAccordion">
            <summary data-i18n="games.sinkOrWin.score.scorecardTitle">Scorekaart</summary>
            <section class="finalScorecardSection">
                <div id="finalScorecard"></div>
            </section>
        </details>

        <!-- Puntenverloop -->
        <details class="finalAccordion">
            <summary data-i18n="games.sinkOrWin.score.pointsProgressTitle">Puntenverloop</summary>
            <section class="finalPointsSection">
                <div id="finalPointsChart"></div>
            </section>
        </details>

        <!-- Gebeurtenissen -->
        <details class="finalAccordion">
            <summary data-i18n="games.sinkOrWin.score.holeEventsTitle">Gebeurtenissen per hole</summary>
            <section class="finalEventsSection">
                <div id="finalEventsList"></div>
            </section>
        </details>

    </section>

    <footer class="pageFooter">
        <button
            type="button"
            id="finishHoleButton"
            class="primaryButton"
            data-i18n="games.sinkOrWin.score.reviewScoresButton"
            disabled>
            Scores controleren →
        </button>
    </footer>

</main>

<script src="https://unpkg.com/lucide@latest"></script>
<script src="js/handicap.js"></script>
<script type="module" src="js/score.js"></script>
<script type="module"  src="../../../navigation.js"></script>
<script type="module" src="../../../home.js"></script>
<script src="../../js/icons.js"></script>

<script>
    window.va = window.va || function () {
        (window.vaq = window.vaq || []).push(arguments);
    };
</script>
<script defer src="/_vercel/insights/script.js"></script>

</body>
</html>
