
<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#194D3A">

    <title data-i18n="games.sinkOrWin.course.pageTitle">Golfbaan - Sink or Win | PAR-TEE</title>

    <link rel="stylesheet" href="../spin-the-tee/css/style.css">
    <link rel="stylesheet" href="../../css/navigation.css">
    <link rel="stylesheet" href="css/sink-or-win.css">
    <link rel="stylesheet" href="css/baan.css">
</head>

<body>

    <main class="page baanPage">

        <header class="pageHeader">
            <h1 data-i18n="games.sinkOrWin.course.title">Kies je golfbaan</h1>
        </header>

        <section class="pageContent">

            <section class="courseSection">

                <div class="courseSearch">

                <div class="courseSearchInputGroup">
                        <label for="courseSearchInput" data-i18n="games.sinkOrWin.course.searchLabel">
                            Zoek een golfbaan
                        </label>

                        <input
                            type="search"
                            id="courseSearchInput"
                            placeholder="Zoek op naam of plaats"
                            data-i18n-placeholder="games.sinkOrWin.course.searchPlaceholder"
                            autocomplete="off"
                        >

                        <button
                            type="button"
                            id="courseSearchButton"
                            class="primaryButton"
                            data-i18n="common.search"
                        >
                            Zoeken
                        </button>
                    </div>

                    <div class="courseSearchActions">
                        <select id="courseCountry">
                            <option value="" data-i18n="games.sinkOrWin.course.allCountries">
                                Alle landen
                            </option>
                        </select>
                    </div>

                    <p
                        id="courseSearchStatus"
                        class="courseSearchStatus"
                        role="status"
                        aria-live="polite"
                        hidden
                    ></p>

                </div>

                <div
                    id="courseSearchResults"
                    class="courseSearchResults"
                    aria-label="Zoekresultaten"
                ></div>

                <nav
                    id="coursePagination"
                    class="coursePagination"
                    aria-label="Paginering zoekresultaten"
                    hidden
                >
                    <button
                        type="button"
                        id="previousCoursePage"
                        class="secondaryButton"
                        disabled
                    >
                        Vorige
                    </button>

                    <span id="coursePageInfo" aria-live="polite"></span>

                    <button
                        type="button"
                        id="nextCoursePage"
                        class="secondaryButton"
                        disabled
                    >
                        Volgende
                    </button>
                </nav>

                <section class="recentCoursesSection">
                    <div id="courseList" class="courseList"></div>
                </section>

            </section>

            <section
                id="selectedCourseSection"
                class="selectedCourseSection"
                hidden
            >

                <div class="selectedCourseOverview">
                    <div id="selectedCourseDetails"></div>
                </div>

            </section>

            <section
                id="roundSelection"
                class="roundSelection"
                hidden
            >

                <div class="sectionHeader">
                    <h2 data-i18n="games.sinkOrWin.course.holes">
                        Hoeveel holes spelen jullie?
                    </h2>
                </div>

                <div id="roundOptions" class="roundOptions"></div>

            </section>

            <p
                id="courseValidationMessage"
                class="validationMessage"
                role="status"
                hidden
            ></p>

        </section>

        <footer class="pageFooter">
            <button
                type="button"
                id="continueButton"
                class="primaryButton"
                data-i18n="games.sinkOrWin.course.chooseCourse"
                disabled
            >
                Kies eerst een baan →
            </button>
        </footer>

    </main>

    <section id="existingGamePrompt" class="existingGamePrompt" hidden>
        <div class="existingGameCard">

            <h2 data-i18n="games.sinkOrWin.course.existingGametitle">
                Er staat nog een spel open
            </h2>

            <p data-i18n="games.sinkOrWin.course.existingGame">
                Wil je verdergaan met je vorige ronde of een nieuw spel starten?
            </p>

            <button
                type="button"
                id="resumeGameButton"
                class="primaryButton"
                data-i18n="games.sinkOrWin.course.resumeGame"
            >
                Verder gaan met spel
            </button>

            <button
                type="button"
                id="startNewGameButton"
                class="secondaryButton"
                data-i18n="games.sinkOrWin.course.newGame"
            >
                Nieuw spel starten
            </button>

        </div>
    </section>

    <script src="https://unpkg.com/lucide@latest"></script>
    <script type="module" src="js/baan.js"></script>
    <script type="module" src="../../../navigation.js"></script>
    <script type="module" src="../../../home.js"></script>
    <script src="../../js/icons.js"></script>

    <script>
        window.va = window.va || function () {
            (window.vaq = window.vaq || []).push(arguments);
        };
    </script>
    <script defer src="/_vercel/insights/script.js"></script>

</body>
</html>
