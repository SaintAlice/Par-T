<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#194D3A">

    <title data-i18n="games.sinkOrWin.course.pageTitle">Golfbaan - Sink or Win | PAR-TEE</title>

    <link rel="stylesheet" href="../spin-the-tee/css/style.css">
    <link rel="stylesheet" href="../../css/navigation.css">
    <link rel="stylesheet" href="css/sink-or-win.css">
    <link rel="stylesheet" href="css/baan.css">
</head>

<body>

    <main class="page baanPage">

        <header class="pageHeader">
            <h1 data-i18n="games.sinkOrWin.course.title">Kies je golfbaan</h1>
        </header>

        <section class="pageContent">

            <section class="courseSection">

                <div id="courseList" class="courseList">
                    <!-- Golfbanen worden hier weergegeven -->
                </div>
            </section>

            <section id="roundSelection" class="roundSelection" hidden>

            <h2 data-i18n="games.sinkOrWin.course.holes">Hoeveel holes spelen jullie?</h2>

            <div id="roundOptions" class="roundOptions">
                <!-- Rondekeuzes worden hier weergegeven -->
            </div>

        </section>

            <section class="createCourseSection">

                <button
                    type="button"
                    id="createCourseButton"
                    class="secondaryButton"
                    data-i18n="games.sinkOrWin.course.createCourse"
                    disabled
                >
                    + Nieuwe golfbaan aanmaken
                </button>

            </section>

            <section
                id="courseForm"
                class="courseForm"
                hidden
            >

                <h2 data-i18n="games.sinkOrWin.course.newCourse">Nieuwe golfbaan</h2>

                <div class="formGroup">
                    <label for="courseName" data-i18n="games.sinkOrWin.course.nameCourse">Naam golfbaan</label>
                    <input
                        type="text"
                        id="courseName"
                        placeholder="Bijvoorbeeld Hooge Rotterdamsche"
                        data-i18n-placeholder="games.sinkOrWin.course.courseNamePlaceholder"
                        maxlength="60"
                    >
                </div>

                <div class="formGroup">
                    <label for="holeCount" data-i18n="games.sinkOrWin.course.numberCourse">Aantal holes</label>

                    <select id="holeCount">
                        <option value="9" data-i18n="games.sinkOrWin.course.holeCount9">9 holes</option>
                        <option value="18" data-i18n="games.sinkOrWin.course.holeCount18">18 holes</option>
                    </select>
                </div>

                <div id="holeInputs">
                    <!-- Holegegevens worden hier weergegeven -->
                </div>

                <button
                    type="button"
                    id="saveCourseButton"
                    class="primaryButton"
                    data-i18n="games.sinkOrWin.course.saveCourse"
                >
                    Golfbaan opslaan
                </button>

            </section>

            <p
                id="courseValidationMessage"
                class="validationMessage"
                role="status"
                hidden
            ></p>

        </section>

        <footer class="pageFooter">
            <button
                type="button"
                id="continueButton"
                class="primaryButton"
                data-i18n="games.sinkOrWin.course.chooseCourse"
                disabled
            >
                Kies eerst een baan →
            </button>
        </footer>

    </main>

    <section id="existingGamePrompt" class="existingGamePrompt" hidden>
        <div class="existingGameCard">
            <h2 data-i18n="games.sinkOrWin.course.existingGametitle">Er staat nog een spel open</h2>
            <p data-i18n="games.sinkOrWin.course.existingGame">Wil je verdergaan met je vorige ronde of een nieuw spel starten?</p>

            <button type="button" id="resumeGameButton" class="primaryButton" data-i18n="games.sinkOrWin.course.resumeGame">
                Verder gaan met spel
            </button>

            <button type="button" id="startNewGameButton" class="secondaryButton" data-i18n="games.sinkOrWin.course.newGame">
                Nieuw spel starten
            </button>
        </div>
    </section>

    <script src="https://unpkg.com/lucide@latest"></script>
    <script type="module" src="js/baan.js"></script>
    <script type="module"  src="../../../navigation.js"></script>
    <script type="module" src="../../../home.js"></script>
    <script src="../../js/icons.js"></script>

    <!-- Vercel Web Analytics -->
    <script>
        window.va = window.va || function () {
            (window.vaq = window.vaq || []).push(arguments);
        };
    </script>
    <script defer src="/_vercel/insights/script.js"></script>
</body>
</html>
