
<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#194D3A">
    <title>PAR-TEE - Offline</title>

    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #F5F3EA;
            color: #194D3A;
            font-family: Arial, sans-serif;
            text-align: center;
        }

        main {
            padding: 32px;
        }

        h1 {
            font-size: 32px;
        }

        p {
            color: #194D3A;
            line-height: 1.6;
        }

        button {
            padding: 14px 24px;
            border: none;
            border-radius: 12px;
            background: #194D3A;
            color: #F5F3EA;
            font-size: 16px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <main>
        <h1>PAR-TEE</h1>
        <p>Je bent momenteel offline.</p>
        <p>Controleer je internetverbinding en probeer het opnieuw.</p>
        <button onclick="location.reload()">Opnieuw proberen</button>
    </main>
</body>
</html>
